title: IMS Journals Format
author: Rob J Hyndman
version: 0.0.1
quarto-required: ">= 1.4.0"
contributes:
  formats:
    pdf:
      cite-method: natbib
      biblio-style: imsart-number
      pdf-engine: pdflatex
      number-sections: true
      fig-width: 8
      fig-height: 5
      colorlinks: true
      urlcolor: blue
      citecolor: blue
      template: imsarttemplate.tex
      template-partials:
        - "partials/title.tex"
        - "partials/_ims_abstract.tex"
      filters:
        - build-ims-authors.lua
        - ims-environments.lua
        - ims-tables.lua
      format-resources:
        - imsart.cls
        - imsart.sty
        - imsart-number.bst
        - imsart-nameyear.bst
