title: Statistical Science (IMS) Format
author: Rob J Hyndman
version: 0.0.1
quarto-required: ">= 1.4.0"
contributes:
  formats:
    pdf:
      documentclass: imsart
      classoption: [sts]
      cite-method: natbib
      biblio-style: imsart-number
      fig-width: 3.3
      fig-height: 2.5
      colorlinks: true
      urlcolor: blue
      citecolor: blue
      template: imsarttemplate.tex
      template-partials:
        - "partials/title.tex"
        - "partials/_ims_preamble.tex"
        - "partials/_ims_abstract.tex"
      filters:
        - build-ims-authors.lua
        - ims-environments.lua
      format-resources:
        - imsart.cls
        - imsart.sty
        - imsart-number.bst
        - imsart-nameyear.bst
    html:
      number-sections: true
      toc: true
      filters:
        - ims-environments.lua
